<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claytree Society Auction</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 50px;
    max-width: 700px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    color: #333;
    margin-bottom: 15px;
}

p {
    color: #555;
    line-height: 1.6;
    font-size: 18px;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 30px;
    background: #2c7be5;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 18px;
    transition: background 0.3s;
}

.button:hover {
    background: #1a5fb4;
}
</style>

</head>

<div class="container">

<h1>Welcome to the Claytree Society Auction</h1>

<p>
