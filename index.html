<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claytree Society Auction</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 50px;
    max-width: 700px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    color: #866b4a;
    margin-bottom: 15px;
}

p {
    color: #866b4a;
    line-height: 1.6;
    font-size: 18px;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 30px;
    background: #aacdab;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 22px;
    transition: background 0.3s;
}

.button:hover {
    background: #cae3cd;
}

.catalogue-image {
    display: block;
    width: 100%;
    margin-top: 40px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.catalogue-image:hover {
    transform: scale(1.02);
    opacity: 0.95;
}
</style>

</head>

<body>

<div class="container">

<h1>Welcome to the Clay Tree Society Auction</h1>

<p>
Thank you for helping Clay Tree Society Raise the Roof!
</p>

<p>
Please click the button below to view the complete auction catalogue.
</p>

<a class="button" href="Auction Catalogue_compressed-1.pdf" target="_blank">
View Auction Catalogue
</a>

<a href="Auction Catalogue_compressed-1.pdf" target="_blank">
    <img
        src="photo.png"
        alt="View Auction Catalogue"
        class="catalogue-image"
    >
</a>

</div>

</body>
</html>
